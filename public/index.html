<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafetyLog</title>
  <meta name="description" content="SafetyLog — HSE compliance management for Nigerian SMEs" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a5f3f" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>SafetyLog</h1>
    <div class="subtitle">HSE Compliance Management</div>
  </header>

  <main>
    <h2>Phase 1 Features</h2>
    <div class="home-links">
      <a class="btn" href="pages/documents.html">📄 Document Register</a>
      <a class="btn btn--disabled" href="#" title="Coming next in Phase 1">☑️ Toolbox Talk Log (coming soon)</a>
    </div>

    <h2>Planned (Later Phases)</h2>
    <div class="home-links">
      <a class="btn btn--secondary btn--disabled" href="#">🚨 Incident / Near-Miss Reporting</a>
      <a class="btn btn--secondary btn--disabled" href="#">📋 Permit-to-Work</a>
      <a class="btn btn--secondary btn--disabled" href="#">🔧 CAPA Tracker</a>
      <a class="btn btn--secondary btn--disabled" href="#">📊 Dashboard</a>
    </div>
  </main>

  <script>
    // Register the service worker so the app can be installed and used offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
